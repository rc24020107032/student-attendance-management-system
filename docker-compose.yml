version: '3.8'

services:
  # 1. MongoDB Database Container
  mongodb:
    image: mongo:6-jammy
    container_name: attendance_mongo
    restart: unless-stopped
    ports:
      # Port forwarding: Host 27017 mapped to Container 27017
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: attendance_db
    volumes:
      - mongo-data:/data/db
    networks:
      - attendance-network

  # 2. Node.js Express Web Application Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_web_app
    restart: unless-stopped
    ports:
      # Port forwarding: Host 3000 mapped to Container 3000
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/attendance_db
      NODE_ENV: production
    depends_on:
      - mongodb
    volumes:
      - ./logs:/usr/src/app/logs
    networks:
      - attendance-network

  # 3. Optional Jenkins CI Server for pipeline execution testing
  # Spin up with:   docker compose --profile ci up -d jenkins
  # Stop when done: docker compose stop jenkins
  jenkins:
    profiles: ["ci"]
    image: jenkins/jenkins:lts
    container_name: attendance_jenkins_ci
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - attendance-network

volumes:
  mongo-data:
    driver: local
  jenkins-data:
    driver: local

networks:
  attendance-network:
    driver: bridge

